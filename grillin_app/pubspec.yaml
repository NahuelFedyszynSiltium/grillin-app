name: grillin
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  collection: ^1.18.0
  cupertino_icons: ^1.0.2
  dropdown_button2: ^2.3.9
  flutter_exit_app: ^1.1.3
  intl: ^0.19.0
  mvc_pattern: ^8.12.0
  pie_chart: ^5.4.0
  provider: ^6.0.3
  shimmer: ^3.0.0
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.1
  flutter_test:
    sdk: flutter

flutter_icons:
  image_path: "images/app_icon/"
  android: "launcher_icon"
  adaptive_icon_background: "#FFFFFF" 
  ios: true
  remove_alpha_ios: true


flutter:
  generate: true
  uses-material-design: true

  assets:
    - images/
    - images/app_logo/
    - images/icons/
    - images/splash/